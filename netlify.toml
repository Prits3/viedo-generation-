# Netlify: Next.js is detected and built with Netlify's Next.js runtime (OpenNext adapter).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next prerenders the homepage during this build using Netlify's CONTEXT.
# The demo uses the same sandbox link in previews and on the public site. Keep live settings in the UI.
[context.deploy-preview.environment]
  PILOT_STRIPE_TEST_LINK = "https://buy.stripe.com/test_9B66oGfOD2vT4Lw9Wm7IY00"
  PILOT_PRICE = "€4.99 (test price)"

[context.production.environment]
  PILOT_PUBLIC_TEST_LINK = "https://buy.stripe.com/test_9B66oGfOD2vT4Lw9Wm7IY00"
  PILOT_PUBLIC_TEST_PRICE = "€4.99 (test price)"

# The example videos are larger than a function response may be, so they are served as static
# files copied to public/showcase/ at build time (scripts/copy-showcase-videos.mjs).
[[redirects]]
  from = "/api/lessons/l-n0tfgq8fznas/export/:file"
  to = "/showcase/l-n0tfgq8fznas/:file"
  status = 200
  force = true

[[redirects]]
  from = "/api/lessons/l-ov5pmkhgkfz6/export/:file"
  to = "/showcase/l-ov5pmkhgkfz6/:file"
  status = 200
  force = true

[[redirects]]
  from = "/api/lessons/l-zl0jsgukw6kl/export/:file"
  to = "/showcase/l-zl0jsgukw6kl/:file"
  status = 200
  force = true

[[headers]]
  for = "/showcase/*"
  [headers.values]
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"

[functions]
  # Example lessons are read from disk at runtime; file tracing cannot see the dynamic paths.
  included_files = ["showcase/**"]
